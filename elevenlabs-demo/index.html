<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palabre numérique — Lecture vocale</title><style>body{font:17px system-ui;max-width:700px;margin:30px auto;padding:18px;background:#f5f6f8}main{background:white;border-radius:16px;padding:25px}textarea{box-sizing:border-box;width:100%;min-height:170px;font:inherit;padding:12px}button{padding:12px;margin:8px 5px 0 0;border:0;border-radius:8px;background:#184e77;color:white}select{padding:9px}</style><main><h1>Palabre numérique — Voix</h1><p>Prototype accessible : lecture vocale locale du navigateur, sans clé API. L'intégration ElevenLabs nécessite un serveur sécurisé.</p><label for="message">Message à écouter</label><textarea id="message">Bienvenue sur Palabre numérique, un espace de dialogue et de partage.</textarea><p><label for="lang">Langue de lecture : </label><select id="lang"><option value="fr">Français</option><option value="so">Somali (si disponible)</option><option value="ar">Arabe</option></select></p><button id="play">Écouter</button><button id="stop">Arrêter</button><p id="status" role="status"></p></main><script>const q=id=>document.getElementById(id);q('play').onclick=()=>{if(!('speechSynthesis'in window)){q('status').textContent='Synthèse vocale indisponible sur ce navigateur';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(q('message').value.slice(0,3000));u.lang=q('lang').value;u.rate=.85;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(u.lang));if(v)u.voice=v;u.onerror=()=>q('status').textContent='Lecture impossible : vérifiez les voix installées';q('status').textContent='Lecture en cours';u.onend=()=>q('status').textContent='Lecture terminée';speechSynthesis.speak(u)};q('stop').onclick=()=>{speechSynthesis.cancel();q('status').textContent='Lecture arrêtée'}</script></html>
