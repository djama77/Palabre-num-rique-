name: Palabre web interface tests
on:
  push:
    branches:
      - main
      - feature/heritage-web-interface-v1
  pull_request:
    paths:
      - 'backend/heritage/**'
      - 'frontend/heritage/**'
      - '.github/workflows/heritage-web-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check browser JavaScript syntax
        run: |
          node --check frontend/heritage/supabase-cloud.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("frontend/heritage/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/palabre-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/palabre-inline.js
      - name: Run heritage API and web tests
        run: python -m unittest discover -s backend/heritage -p 'test_*.py' -v
