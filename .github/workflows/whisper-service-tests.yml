name: Palabre Whisper service tests
on:
  push:
    branches:
      - main
      - feat/palabre-supabase-dedicated
      - fix/palabre-audio-privacy-hardening
  pull_request:
    paths:
      - 'backend/whisper_service/**'
      - '.github/workflows/whisper-service-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight API test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'python-multipart>=0.0.9'
      - name: Run Whisper API tests without downloading a model
        working-directory: backend/whisper_service
        run: python -m unittest -v
