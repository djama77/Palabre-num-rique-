name: Heritage and voice unit tests
on:
  push:
    branches: [feature/elevenlabs-voice-v1]
  pull_request:
    paths:
      - 'backend/heritage/**'
      - 'backend/voice/**'
      - '.github/workflows/heritage-voice-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Heritage tests
        run: python -m unittest discover -s backend/heritage -p 'test_*.py' -v
      - name: Voice adapter tests
        run: python -m unittest discover -s backend/voice -p 'test_*.py' -v
